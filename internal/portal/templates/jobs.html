{{define "content"}}
<div class="container">
    <h1>Jobs</h1>
    <button onclick="fetch('/api/v1/jobs', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({kind: 'dry-build', args: []})})">New dry-build</button>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Kind</th>
                <th>Host</th>
                <th>State</th>
                <th>Created At</th>
            </tr>
        </thead>
        <tbody id="jobs-table" hx-get="/partials/jobs" hx-trigger="every 2s">
            {{template "jobs_partial" .}}
        </tbody>
    </table>
</div>
{{end}}

{{define "jobs_partial"}}
{{range .Jobs}}
<tr>
    <td><a href="/jobs/{{.ID}}">{{.ID}}</a></td>
    <td>{{.Kind}}</td>
    <td>{{.Host}}</td>
    <td><span class="badge state-{{.State}}">{{.State}}</span></td>
    <td>{{.CreatedAt.Format "2006-01-02 15:04:05"}}</td>
</tr>
{{end}}
{{end}}

{{define "jobs.html"}}
{{template "base.html" .}}
{{end}}
