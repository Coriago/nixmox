<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nixmox · Settings</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/settings.js" defer></script></head>
<body><header><a href="/ui/network">Nixmox</a><a href="/ui/cluster">Cluster</a><a href="/ui/sources">Sources</a><a href="/ui/settings">Settings</a></header><main id="settings" data-node="{{.TargetID}}">
<h1>Settings</h1><p id="settings-notice" role="status"></p><p id="settings-task"></p><button id="retry-settings" hidden>Retry original command</button>
<section><h2>Credentials</h2><div id="credentials-list"></div><h3>Add credential</h3>
<form id="credential-import" autocomplete="off"><label>Name <input name="name" required maxlength="64" autocomplete="off"></label><label>Kind <select name="kind"><option value="git-http-token">Git HTTPS token</option><option value="git-ssh-key">Git SSH key</option><option value="ssh-private-key">Bootstrap SSH key</option><option value="nix-cache-signing-key">Nix cache signing key</option><option value="sops-age-key">SOPS age key</option></select></label><label>Storage node <select name="node" required></select></label><label>Value <input name="value" type="password" autocomplete="new-password"></label><label>Or select a secret file (preserves multiline keys) <input name="file" type="file"></label><button>Save</button></form><p>Retry an uncertain import with the same name, kind, node and value. Secret values are never returned.</p></section>
<section><h2>Cache</h2><pre id="cache-status"></pre><form id="cache-select"><label>Signing credential <select name="credential" required></select></label><button>Select</button></form><form id="cache-locate"><label>Store output <input name="path" required placeholder="/nix/store/…"></label><button>Locate</button></form><pre id="cache-locations"></pre></section>
<section><h2>Repository credential</h2><form id="repository-credential"><label>Repository <select name="repository" required></select></label><label>Credential <select name="credential"><option value="">Public remote</option></select></label><button>Select</button></form></section>
</main></body></html>
