<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nixmox · Sources</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/wasm_exec.js" defer></script><script src="/assets/sources.js" defer></script></head>
<body><header><a href="/ui/network">Nixmox</a><a href="/ui/cluster">Cluster</a><a href="/ui/sources">Sources</a></header><main id="sources" data-node="{{.TargetID}}">
<h1>Repositories and configurations</h1><p id="source-notice" role="status">Loading repositories…</p>
<section><h2>Target host</h2><label>Host <select id="target-host"></select></label><p id="host-details"></p><button id="refresh-hosts">Refresh hosts</button><button id="preview-host">Preview assigned configuration</button><button id="build-host">Build candidate</button><pre id="build-progress"></pre><pre id="candidate-result"></pre></section>
<section><h2>Import repository</h2><form id="import-repository"><label>Name <input name="name" required maxlength="64"></label><label>Remote URL <input name="remote_url" required></label><label>Upstream branch <input name="upstream_branch" value="main" required></label><button>Import</button></form></section>
<section><h2>Repositories</h2><div id="repository-list"></div></section>
<section id="repository-detail" hidden><h2 id="repository-name"></h2><p id="repository-pin"></p><button id="fetch-repository">Fetch upstream</button><button id="new-configuration">New configuration</button><h3>References</h3><div id="reference-list"></div><h3>Configurations</h3><div id="configuration-list"></div></section>
<section id="configuration-editor" hidden><h2>Configuration draft</h2><p id="draft-state"></p><label>Template <select id="template-choice"></select></label><div class="source-editor"><form id="configuration-fields"></form><div><label>Generated file <select id="file-choice"></select></label><textarea id="file-editor" rows="20" spellcheck="false" aria-label="Generated file editor"></textarea><div id="regenerated-review" hidden><p>Form changes produced different text. Your edits are preserved.</p><pre id="regenerated-text"></pre><button id="replace-generated">Replace with regenerated text</button><button id="keep-edits">Keep my edits</button></div></div></div><button id="save-draft">Save draft</button><button id="validate-draft">Validate</button><button id="commit-draft">Commit locally</button><h3>Review changes</h3><pre id="draft-diff"></pre></section>
<section><h2>Open saved draft</h2><form id="open-draft"><label>Draft ID <input name="draft_id" required></label><button>Open</button></form></section>
</main></body></html>
