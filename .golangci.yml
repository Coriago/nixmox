run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
  disable:
    - lll

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: nixmox

issues:
  exclude-use-default: false
